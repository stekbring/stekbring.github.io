<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktiva Flashcards i Canvas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #422634; /* Färg från palett */
            margin: 0;
            overflow: hidden; /* Förhindrar scroll då vi använder canvas för allt */
            color: #E585B4;
        }
        #canvas-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        canvas {
            display: block;
            flex-grow: 1;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Låter klick gå igenom till canvas om de inte träffar knappar */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1.5rem;
            box-sizing: border-box;
        }
        .controls {
            pointer-events: auto; /* Aktiverar klick för UI-elementen */
        }
        
        /* Styling för knappar baserat på färgpaletten */
        .btn {
            background-color: #945674;
            color: #fff;
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            font-weight: 600;
            transition: all 0.2s ease;
            border: 2px solid transparent;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .btn:hover {
            background-color: #B86A90;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn.active-mode {
            background-color: #E585B4;
            color: #422634;
            border-color: #fff;
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <!-- Canvas elementet där själva korten och animationen ritas -->
        <canvas id="flashcardCanvas"></canvas>

        <!-- UI överlägg för knappar och kontroller -->
        <div class="ui-layer">
            
            <!-- Toppmeny med inställningar -->
            <div class="controls flex flex-col sm:flex-row justify-between items-center gap-4">
                <h1 class="text-3xl font-extrabold text-[#E585B4] drop-shadow-md tracking-tight">Flashcards</h1>
                
                <div class="flex bg-[#6B3E54] p-1 rounded-full shadow-inner">
                    <button id="btnOrder" class="btn active-mode !py-2 !px-4 !text-sm">I ordning</button>
                    <button id="btnRandom" class="btn !bg-transparent !py-2 !px-4 !text-sm hover:!bg-[#945674]">Slumpmässigt</button>
                </div>
            </div>

            <!-- Bottenmeny med navigering -->
            <div class="controls flex justify-center gap-6 pb-4">
                <button id="btnPrev" class="btn flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    Föregående
                </button>
                <button id="btnNext" class="btn flex items-center gap-2">
                    Nästa
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Färgpalett från bilden
        const colors = {
            c1: '#B86A90', // Ljuslila/rosa
            c2: '#945674', // Mellanlila
            c3: '#6B3E54', // Mörklila
            c4: '#422634', // Mörk bakgrund
            c5: '#E585B4'  // Ljusrosa (accent)
        };

        // Canvas setup
        const canvas = document.getElementById('flashcardCanvas');
        const ctx = canvas.getContext('2d');
        
        // Tillstånds-variabler
        let questions = [];
        let shuffledIndices = [];
        let currentIndex = 0;
        let isRandomMode = false;
        
        // Animations-variabler för kortet
        let cardState = 'front'; // 'front' eller 'back'
        let flipAngle = 0;
        let targetFlipAngle = 0;
        let isAnimating = false;

        // Reservdata ifall questions.json inte kan laddas pga CORS/lokal fil
        const fallbackData = [
            {
                "q": "Välkommen! Detta är ett exempelflashcard.\nEftersom filen körs lokalt kunde inte questions.json läsas automatiskt pga webbläsarens säkerhetsregler (CORS).\n\nFör att läsa in din egen fil, kör sidan via en lokal webbserver (t.ex. Live Server i VSCode).",
                "a": "Klicka 'Nästa' för att se ett riktigt exempel från din lista som jag har lagt in manuellt i koden som reserv!"
            },
            {
                "q": "Vad är definitionen på takykardi och bradykardi?",
                "a": "- Takykardi = puls >100/min.\n- Bradykardi = puls <50 slag/min (Internetmedicin, 2020 & janusinfo, 2019)"
            },
            {
                "q": "I vilken riktning påverkas TSH och tyroxin (T4) om en patient är drabbad av hypotyreos?",
                "a": "TSH förhöjt. T4 och T3 är sänkta (internetmedicin, 2020)"
            }
        ];


        // Hantera fönsterstorlek för skarp canvas (retina displays)
        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
            draw();
        }
        window.addEventListener('resize', resizeCanvas);

        // Hämta frågor från JSON
        async function fetchQuestions() {
            try {
                const response = await fetch('questions.json');
                if (!response.ok) throw new Error("Kunde inte hämta filen");
                const data = await response.json();
                questions = data;
            } catch (error) {
                console.warn("Kunde inte ladda questions.json. Använder reservdata. Fel: ", error);
                questions = fallbackData;
            }
            initApp();
        }

        function initApp() {
            // Skapa index-lista för slumpmässigt läge
            shuffledIndices = Array.from({length: questions.length}, (_, i) => i);
            shuffleArray(shuffledIndices);
            
            resizeCanvas();
            requestAnimationFrame(animationLoop);
        }


        // Hjälpfunktion för att blanda array (Fisher-Yates)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // Returnerar det aktuella fråge-objektet baserat på läge
        function getCurrentQuestion() {
            if (questions.length === 0) return {q: "Laddar...", a: "Laddar..."};
            if (isRandomMode) {
                return questions[shuffledIndices[currentIndex]];
            }
            return questions[currentIndex];
        }

        // Returnerar det aktuella numret för visning (ex: 5 av 20)
        function getQuestionDisplayNumber() {
            if (isRandomMode) {
                return (shuffledIndices[currentIndex] + 1);
            }
            return (currentIndex + 1);
        }

        // Funktion för att rita text som bryts över flera rader i Canvas
        function getWrappedTextLines(ctx, text, maxWidth, fontSize) {
            ctx.font = `${fontSize}px Inter`;
            const paragraphs = text.split('\n');
            const lines = [];

            for (let p of paragraphs) {
                if (p.trim() === '') {
                    lines.push(''); // Bevara tomma rader
                    continue;
                }
                const words = p.split(' ');
                let currentLine = words[0];

                for (let i = 1; i < words.length; i++) {
                    const word = words[i];
                    const width = ctx.measureText(currentLine + " " + word).width;
                    if (width < maxWidth) {
                        currentLine += " " + word;
                    } else {
                        lines.push(currentLine);
                        currentLine = word;
                    }
                }
                lines.push(currentLine);
            }
            return lines;
        }


        // Ritar en rektangel med rundade hörn
        function drawRoundRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }

        function draw() {
            const w = window.innerWidth;
            const h = window.innerHeight;

            // 1. Rensa bakgrunden
            ctx.fillStyle = colors.c4;
            ctx.fillRect(0, 0, w, h);

            // 2. Beräkna kortets storlek och position
            // Gör kortet responsivt
            let cardWidth = Math.min(w * 0.9, 800);
            let padding = 40;
            if (w < 600) padding = 20; // Mindre padding på mobiler

            // För att anpassa kortets höjd dynamiskt baserat på texten,
            // måste vi mäta texten för både fram och baksida först.
            const qData = getCurrentQuestion();
            
            // Anpassa fontstorlek om texten är extremt lång (dynamisk typografi)
            let baseFontSize = w < 600 ? 18 : 24;
            let lineHeight = baseFontSize * 1.5;
            
            const maxTextWidth = cardWidth - (padding * 2);
            
            let frontLines = getWrappedTextLines(ctx, qData.q, maxTextWidth, baseFontSize);
            let backLines = getWrappedTextLines(ctx, qData.a, maxTextWidth, baseFontSize - 2); // Något mindre text för svar då de är längre

            // Minska fontstorlek om svaret tar för mycket plats
            let backLineHeight = (baseFontSize - 2) * 1.5;
            let maxAllowedLines = Math.floor((h * 0.6) / backLineHeight);
            
            if (backLines.length > maxAllowedLines) {
                const reducedFontSize = w < 600 ? 14 : 16;
                backLines = getWrappedTextLines(ctx, qData.a, maxTextWidth, reducedFontSize);
                backLineHeight = reducedFontSize * 1.5;
            }

            const frontTextHeight = frontLines.length * lineHeight;
            const backTextHeight = backLines.length * backLineHeight;
            
            // Kortets höjd blir den högsta av fram/baksida plus utrymme för nummer/padding
            let cardHeight = Math.max(frontTextHeight, backTextHeight) + (padding * 3) + 40;
            // Begränsa minsta höjd
            cardHeight = Math.max(cardHeight, 300);

            const cardX = (w - cardWidth) / 2;
            const cardY = (h - cardHeight) / 2;

            // 3. Utför 3D-snurr transformationen
            ctx.save();
            
            // Flytta origo till kortets mitt för skalningen
            ctx.translate(cardX + cardWidth / 2, cardY + cardHeight / 2);
            
            // Beräkna skalning (cosinus av vinkeln ger en 3D-flipp effekt)
            // Använd Math.abs så att kortet inte ritas spegelvänt när vinkeln passerar 90 grader
            const scaleX = Math.abs(Math.cos(flipAngle));
            ctx.scale(scaleX, 1);
            
            // Flytta tillbaka origo
            ctx.translate(-(cardX + cardWidth / 2), -(cardY + cardHeight / 2));

            // Bestäm vilken sida som ska ritas (över 90 grader = baksidan)
            const isShowingBack = flipAngle > Math.PI / 2;

            // 4. Rita kortets bakgrund & skugga
            ctx.shadowColor = "rgba(0,0,0,0.4)";
            ctx.shadowBlur = 20;
            ctx.shadowOffsetY = 10;
            
            drawRoundRect(ctx, cardX, cardY, cardWidth, cardHeight, 20);
            
            // Färg baserad på fram/baksida
            ctx.fillStyle = isShowingBack ? colors.c2 : colors.c3;
            ctx.fill();
            
            // Stäng av skugga för texten
            ctx.shadowColor = "transparent";

            // 5. Rita innehållet
            // Rita linje i toppen
            ctx.fillStyle = colors.c1;
            drawRoundRect(ctx, cardX, cardY, cardWidth, 10, 20);
            // Fyll nedre hörnen på topplinjen för att göra den rak i botten
            ctx.fillRect(cardX, cardY + 5, cardWidth, 5);

            // Rita Frågans nummer i toppen
            ctx.fillStyle = isShowingBack ? "#ffffff" : colors.c5;
            ctx.font = `bold ${w < 600 ? 14 : 16}px Inter`;
            ctx.textAlign = "center";
            ctx.fillText(
                `Fråga ${getQuestionDisplayNumber()} av ${questions.length}`, 
                cardX + cardWidth / 2, 
                cardY + 35
            );

            // Rita texten (Fråga eller Svar)
            ctx.textAlign = "left";
            ctx.textBaseline = "top";
            
            let currentLines = isShowingBack ? backLines : frontLines;
            let currentLineHeight = isShowingBack ? backLineHeight : lineHeight;
            let currentFontSize = isShowingBack ? (backLines === frontLines ? baseFontSize : (backLineHeight/1.5)) : baseFontSize;
            
            ctx.font = `${isShowingBack ? 'normal' : '600'} ${currentFontSize}px Inter`;
            ctx.fillStyle = "#ffffff";

            // Centrera texten vertikalt på kortet
            let textStartY = cardY + (cardHeight - (currentLines.length * currentLineHeight)) / 2;
            
            // Om texten är väldigt lång, flytta upp den lite så den inte krockar med numret
            if (textStartY < cardY + 60) {
                textStartY = cardY + 60;
            }

            for (let i = 0; i < currentLines.length; i++) {
                ctx.fillText(
                    currentLines[i], 
                    cardX + padding, 
                    textStartY + (i * currentLineHeight)
                );
            }

            ctx.restore(); // Återställ transformationer
        }


        // Huvudloop för animationer
        function animationLoop() {
            if (isAnimating) {
                // Interpolera vinkeln mot målet för en mjuk (ease-out) snurr
                flipAngle += (targetFlipAngle - flipAngle) * 0.1;
                
                // Om vi är nära målet, stanna animationen
                if (Math.abs(targetFlipAngle - flipAngle) < 0.01) {
                    flipAngle = targetFlipAngle;
                    isAnimating = false;
                }
            }
            
            draw();
            requestAnimationFrame(animationLoop);
        }

        // Trigga kortflipp
        function flipCard() {
            if (isAnimating) return; // Förhindra dubbelklick under animation
            
            isAnimating = true;
            if (cardState === 'front') {
                targetFlipAngle = Math.PI; // Snurra 180 grader till baksidan
                cardState = 'back';
            } else {
                targetFlipAngle = 0; // Snurra tillbaka till framsidan
                cardState = 'front';
            }
        }

        // Klick på canvas = flippa kortet
        canvas.addEventListener('click', () => {
            flipCard();
        });

        // Byt fråga och återställ kortet
        function changeQuestion(delta) {
            if (questions.length === 0) return;
            
            currentIndex += delta;
            
            // Loopa runt om vi når slutet/början
            if (currentIndex >= questions.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = questions.length - 1;

            // Återställ kortet till framsidan omedelbart utan animering
            flipAngle = 0;
            targetFlipAngle = 0;
            cardState = 'front';
            isAnimating = false;
            
            draw();
        }

        // Lyssna på navigationsknapparna
        document.getElementById('btnNext').addEventListener('click', (e) => {
            e.stopPropagation(); // Förhindra att klicket går till canvas
            changeQuestion(1);
        });

        document.getElementById('btnPrev').addEventListener('click', (e) => {
            e.stopPropagation();
            changeQuestion(-1);
        });

        // Lyssna på läges-knapparna (Ordning / Slumpmässigt)
        const btnOrder = document.getElementById('btnOrder');
        const btnRandom = document.getElementById('btnRandom');

        btnOrder.addEventListener('click', (e) => {
            e.stopPropagation();
            if(!isRandomMode) return;
            
            isRandomMode = false;
            currentIndex = 0; // Börja från början
            
            // Uppdatera UI
            btnOrder.classList.add('active-mode', '!text-sm', '!bg-[#E585B4]', '!text-[#422634]');
            btnOrder.classList.remove('!bg-transparent');
            
            btnRandom.classList.remove('active-mode', '!bg-[#E585B4]', '!text-[#422634]');
            btnRandom.classList.add('!bg-transparent');
            
            changeQuestion(0); // Tvinga uppdatering
        });

        btnRandom.addEventListener('click', (e) => {
            e.stopPropagation();
            if(isRandomMode) return;
            
            isRandomMode = true;
            currentIndex = 0;
            shuffleArray(shuffledIndices); // Blanda om!
            
            // Uppdatera UI
            btnRandom.classList.add('active-mode', '!text-sm', '!bg-[#E585B4]', '!text-[#422634]');
            btnRandom.classList.remove('!bg-transparent');
            
            btnOrder.classList.remove('active-mode', '!bg-[#E585B4]', '!text-[#422634]');
            btnOrder.classList.add('!bg-transparent');
            
            changeQuestion(0); // Tvinga uppdatering
        });

        // Starta appen
        fetchQuestions();

    </script>
</body>
</html>
