<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#422634">
    <title>Interaktiva Flashcards i Canvas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #422634; /* Färg från palett */
            margin: 0;
            overflow: hidden; /* Förhindrar scroll då vi använder canvas för allt */
            overscroll-behavior: none;
            color: #E585B4;
            -webkit-tap-highlight-color: transparent;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            /* 100vh på mobil räknar med adressfältet -> knapparna hamnar utanför.
               100dvh = den faktiskt synliga höjden. (JS sätter höjden som reserv
               i äldre webbläsare som saknar dvh.) */
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
            touch-action: manipulation;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none; /* Låter klick gå igenom till canvas om de inte träffar knappar */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            /* Säkra marginaler för notch och hemindikator på iPhone/Android */
            padding: max(1rem, env(safe-area-inset-top))
                     max(1rem, env(safe-area-inset-right))
                     max(1rem, env(safe-area-inset-bottom))
                     max(1rem, env(safe-area-inset-left));
            box-sizing: border-box;
        }
        @media (min-width: 640px) {
            .ui-layer {
                padding: max(1.5rem, env(safe-area-inset-top))
                         max(1.5rem, env(safe-area-inset-right))
                         max(1.5rem, env(safe-area-inset-bottom))
                         max(1.5rem, env(safe-area-inset-left));
            }
        }
        .controls {
            pointer-events: auto; /* Aktiverar klick för UI-elementen */
        }
        
        /* Styling för knappar baserat på färgpaletten */
        .btn {
            background-color: #945674;
            color: #fff;
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            font-weight: 600;
            transition: all 0.2s ease;
            border: 2px solid transparent;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            white-space: nowrap;
            touch-action: manipulation; /* Ingen dubbeltryck-zoom på knapparna */
        }
        @media (max-width: 639px) {
            .btn {
                padding: 0.7rem 1rem;
            }
        }
        /* Hover bara på enheter med mus, annars "fastnar" effekten på mobiler */
        @media (hover: hover) {
            .btn:hover {
                background-color: #B86A90;
                transform: translateY(-2px);
                box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            }
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn.active-mode {
            background-color: #E585B4;
            color: #422634;
            border-color: #fff;
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <!-- Canvas elementet där själva korten och animationen ritas -->
        <canvas id="flashcardCanvas"></canvas>

        <!-- UI överlägg för knappar och kontroller -->
        <div class="ui-layer">
            
            <!-- Toppmeny med inställningar -->
            <div id="topBar" class="controls flex flex-col sm:flex-row justify-between items-center gap-2 sm:gap-4">
                <h1 class="text-2xl sm:text-3xl font-extrabold text-[#E585B4] drop-shadow-md tracking-tight">Flashcards</h1>
                
                <div class="flex bg-[#6B3E54] p-1 rounded-full shadow-inner">
                    <button id="btnOrder" class="btn active-mode !py-2 !px-4 !text-sm">I ordning</button>
                    <button id="btnRandom" class="btn !bg-transparent !py-2 !px-4 !text-sm hover:!bg-[#945674]">Slumpmässigt</button>
                </div>
            </div>

            <!-- Bottenmeny med navigering -->
            <div id="bottomBar" class="controls flex justify-center gap-3 sm:gap-6">
                <button id="btnPrev" class="btn flex flex-1 sm:flex-none items-center justify-center gap-2 max-w-[13rem]">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    Föregående
                </button>
                <button id="btnNext" class="btn flex flex-1 sm:flex-none items-center justify-center gap-2 max-w-[13rem]">
                    Nästa
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Färgpalett från bilden
        const colors = {
            c1: '#B86A90', // Ljuslila/rosa
            c2: '#945674', // Mellanlila
            c3: '#6B3E54', // Mörklila
            c4: '#422634', // Mörk bakgrund
            c5: '#E585B4'  // Ljusrosa (accent)
        };

        // Canvas setup
        const canvas = document.getElementById('flashcardCanvas');
        const ctx = canvas.getContext('2d');
        
        // Tillstånds-variabler
        let questions = [];
        let shuffledIndices = [];
        let currentIndex = 0;
        let isRandomMode = false;
        
        // Animations-variabler för kortet
        let cardState = 'front'; // 'front' eller 'back'
        let flipAngle = 0;
        let targetFlipAngle = 0;
        let isAnimating = false;

        // Reservdata ifall questions.json inte kan laddas pga CORS/lokal fil
        const fallbackData = [
            {
                "q": "Välkommen! Detta är ett exempelflashcard.\nEftersom filen körs lokalt kunde inte questions.json läsas automatiskt pga webbläsarens säkerhetsregler (CORS).\n\nFör att läsa in din egen fil, kör sidan via en lokal webbserver (t.ex. Live Server i VSCode).",
                "a": "Klicka 'Nästa' för att se ett riktigt exempel från din lista som jag har lagt in manuellt i koden som reserv!"
            },
            {
                "q": "Vad är definitionen på takykardi och bradykardi?",
                "a": "- Takykardi = puls >100/min.\n- Bradykardi = puls <50 slag/min (Internetmedicin, 2020 & janusinfo, 2019)"
            },
            {
                "q": "I vilken riktning påverkas TSH och tyroxin (T4) om en patient är drabbad av hypotyreos?",
                "a": "TSH förhöjt. T4 och T3 är sänkta (internetmedicin, 2020)"
            }
        ];


        // Element för att mäta ut tillgänglig yta
        const container = document.getElementById('canvas-container');
        const topBar = document.getElementById('topBar');
        const bottomBar = document.getElementById('bottomBar');
        const supportsDvh = !!(window.CSS && CSS.supports && CSS.supports('height', '100dvh'));

        // Synlig storlek (CSS-pixlar) och ytan mellan topp- och bottenmenyn där kortet får plats
        let viewW = window.innerWidth;
        let viewH = window.innerHeight;
        let cardArea = { top: 0, bottom: viewH };
        let layoutCache = null;

        // Hantera fönsterstorlek för skarp canvas (retina displays)
        function resizeCanvas() {
            // Reserv för webbläsare utan dvh: använd den faktiskt synliga höjden
            if (!supportsDvh) container.style.height = window.innerHeight + 'px';

            const rect = container.getBoundingClientRect();
            viewW = rect.width;
            viewH = rect.height;

            const dpr = Math.min(window.devicePixelRatio || 1, 3);
            canvas.width = Math.round(viewW * dpr);
            canvas.height = Math.round(viewH * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // Nollställ skalan (ackumuleras inte)

            // Kortet ska ligga mellan toppmenyn och knapparna i botten
            const gap = viewW < 600 ? 12 : 20;
            cardArea.top = topBar.getBoundingClientRect().bottom - rect.top + gap;
            cardArea.bottom = bottomBar.getBoundingClientRect().top - rect.top - gap;

            layoutCache = null;
            draw();
        }

        // Samla ihop många resize-händelser till en per bildruta
        let resizeQueued = false;
        function queueResize() {
            if (resizeQueued) return;
            resizeQueued = true;
            requestAnimationFrame(() => { resizeQueued = false; resizeCanvas(); });
        }
        window.addEventListener('resize', queueResize);
        window.addEventListener('orientationchange', () => setTimeout(queueResize, 250));
        if (window.visualViewport) window.visualViewport.addEventListener('resize', queueResize);
        if (window.ResizeObserver) {
            new ResizeObserver(queueResize).observe(topBar);
            new ResizeObserver(queueResize).observe(bottomBar);
        }

        // Hämta frågor från JSON
        async function fetchQuestions() {
            try {
                const response = await fetch('questions.json');
                if (!response.ok) throw new Error("Kunde inte hämta filen");
                const data = await response.json();
                questions = data;
            } catch (error) {
                console.warn("Kunde inte ladda questions.json. Använder reservdata. Fel: ", error);
                questions = fallbackData;
            }
            initApp();
        }

        function initApp() {
            // Skapa index-lista för slumpmässigt läge
            shuffledIndices = Array.from({length: questions.length}, (_, i) => i);
            shuffleArray(shuffledIndices);
            
            resizeCanvas();

            // Rita om när typsnittet Inter har laddats (canvas mäter annars med reservtypsnitt)
            if (document.fonts && document.fonts.load) {
                Promise.all([
                    document.fonts.load('600 18px Inter'),
                    document.fonts.load('400 18px Inter')
                ]).then(() => { layoutCache = null; draw(); }).catch(() => {});
            }
        }


        // Hjälpfunktion för att blanda array (Fisher-Yates)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // Returnerar det aktuella fråge-objektet baserat på läge
        function getCurrentQuestion() {
            if (questions.length === 0) return {q: "Laddar...", a: "Laddar..."};
            if (isRandomMode) {
                return questions[shuffledIndices[currentIndex]];
            }
            return questions[currentIndex];
        }

        // Returnerar det aktuella numret för visning (ex: 5 av 20)
        function getQuestionDisplayNumber() {
            if (isRandomMode) {
                return (shuffledIndices[currentIndex] + 1);
            }
            return (currentIndex + 1);
        }

        // Funktion för att rita text som bryts över flera rader i Canvas
        function getWrappedTextLines(ctx, text, maxWidth, font) {
            ctx.font = font;
            const paragraphs = text.split('\n');
            const lines = [];

            for (let p of paragraphs) {
                if (p.trim() === '') {
                    lines.push(''); // Bevara tomma rader
                    continue;
                }
                const words = p.split(' ');
                let currentLine = words[0];

                for (let i = 1; i < words.length; i++) {
                    const word = words[i];
                    const width = ctx.measureText(currentLine + " " + word).width;
                    if (width < maxWidth) {
                        currentLine += " " + word;
                    } else {
                        lines.push(currentLine);
                        currentLine = word;
                    }
                }
                lines.push(currentLine);
            }
            return lines;
        }


        // Ritar en rektangel med rundade hörn
        function drawRoundRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }

        // Räknar ut kortets storlek och textrader så att allt ryms mellan menyerna.
        // Resultatet cachas så att texten inte bryts om i varje bildruta.
        function computeLayout(w) {
            const key = [currentIndex, isRandomMode, questions.length, w, cardArea.top, cardArea.bottom].join('|');
            if (layoutCache && layoutCache.key === key) return layoutCache;

            const qData = getCurrentQuestion();
            const isMobile = w < 600;
            const cardWidth = Math.min(w * (isMobile ? 0.94 : 0.9), 800);
            const padding = isMobile ? 18 : 40;
            const headerSpace = isMobile ? 52 : 65;   // Plats för "Fråga X av Y"
            const bottomSpace = isMobile ? 18 : 40;
            const maxTextWidth = cardWidth - padding * 2;
            const availH = Math.max(cardArea.bottom - cardArea.top, 160);
            const minFont = 9;
            const lh = (size) => size * (size < 14 ? 1.35 : 1.5);

            // Börja med normal storlek och krymp texten tills kortet får plats
            let fontSize = isMobile ? 18 : 24;
            let frontLines, backLines, backFont, needed;
            while (true) {
                backFont = Math.max(fontSize - 2, minFont); // Något mindre text för svar då de är längre
                frontLines = getWrappedTextLines(ctx, qData.q, maxTextWidth, `600 ${fontSize}px Inter`);
                backLines = getWrappedTextLines(ctx, qData.a, maxTextWidth, `normal ${backFont}px Inter`);
                const textH = Math.max(frontLines.length * lh(fontSize), backLines.length * lh(backFont));
                needed = headerSpace + textH + bottomSpace;
                if (needed <= availH || fontSize <= minFont) break;
                fontSize -= 1;
            }

            // Kortets höjd: minst en trevlig grundhöjd, men aldrig större än ytan
            const minHeight = Math.min(isMobile ? 260 : 300, availH);
            const cardHeight = Math.min(Math.max(needed, minHeight), availH);
            const cardX = (w - cardWidth) / 2;
            const cardY = cardArea.top + (availH - cardHeight) / 2;

            layoutCache = {
                key, isMobile, cardWidth, cardHeight, cardX, cardY, padding, headerSpace, bottomSpace,
                front: { lines: frontLines, font: `600 ${fontSize}px Inter`, lineHeight: lh(fontSize) },
                back:  { lines: backLines,  font: `normal ${backFont}px Inter`, lineHeight: lh(backFont) }
            };
            return layoutCache;
        }

        function draw() {
            const w = viewW;
            const h = viewH;

            // 1. Rensa bakgrunden
            ctx.fillStyle = colors.c4;
            ctx.fillRect(0, 0, w, h);

            // 2. Kortets storlek och position (anpassad till skärmen)
            const L = computeLayout(w);
            const { cardX, cardY, cardWidth, cardHeight, padding } = L;

            // 3. Utför 3D-snurr transformationen
            ctx.save();

            // Flytta origo till kortets mitt för skalningen
            ctx.translate(cardX + cardWidth / 2, cardY + cardHeight / 2);

            // Beräkna skalning (cosinus av vinkeln ger en 3D-flipp effekt)
            // Använd Math.abs så att kortet inte ritas spegelvänt när vinkeln passerar 90 grader
            const scaleX = Math.abs(Math.cos(flipAngle));
            ctx.scale(scaleX, 1);

            // Flytta tillbaka origo
            ctx.translate(-(cardX + cardWidth / 2), -(cardY + cardHeight / 2));

            // Bestäm vilken sida som ska ritas (över 90 grader = baksidan)
            const isShowingBack = flipAngle > Math.PI / 2;

            // 4. Rita kortets bakgrund & skugga
            ctx.shadowColor = "rgba(0,0,0,0.4)";
            ctx.shadowBlur = 20;
            ctx.shadowOffsetY = 10;

            drawRoundRect(ctx, cardX, cardY, cardWidth, cardHeight, 20);

            // Färg baserad på fram/baksida
            ctx.fillStyle = isShowingBack ? colors.c2 : colors.c3;
            ctx.fill();

            // Stäng av skugga för texten
            ctx.shadowColor = "transparent";
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;

            // Klipp allt innehåll till kortet så inget ritas utanför
            ctx.clip();

            // 5. Rita innehållet
            // Rita linje i toppen
            ctx.fillStyle = colors.c1;
            ctx.fillRect(cardX, cardY, cardWidth, 10);

            // Rita Frågans nummer i toppen
            ctx.fillStyle = isShowingBack ? "#ffffff" : colors.c5;
            ctx.font = `bold ${L.isMobile ? 14 : 16}px Inter`;
            ctx.textAlign = "center";
            ctx.textBaseline = "alphabetic";
            ctx.fillText(
                `Fråga ${getQuestionDisplayNumber()} av ${questions.length}`,
                cardX + cardWidth / 2,
                cardY + (L.isMobile ? 34 : 38)
            );

            // Rita texten (Fråga eller Svar)
            const side = isShowingBack ? L.back : L.front;
            ctx.textAlign = "left";
            ctx.textBaseline = "top";
            ctx.font = side.font;
            ctx.fillStyle = "#ffffff";

            // Centrera texten vertikalt i ytan under numret
            const contentTop = cardY + L.headerSpace;
            const contentH = cardHeight - L.headerSpace - L.bottomSpace;
            const textH = side.lines.length * side.lineHeight;
            const textStartY = contentTop + Math.max(0, (contentH - textH) / 2);

            for (let i = 0; i < side.lines.length; i++) {
                ctx.fillText(side.lines[i], cardX + padding, textStartY + i * side.lineHeight);
            }

            ctx.restore(); // Återställ transformationer och klippning
        }


        // Huvudloop för animationer
        let rafId = null;
        function requestFrame() {
            if (rafId === null) rafId = requestAnimationFrame(animationLoop);
        }

        function animationLoop() {
            rafId = null;
            if (isAnimating) {
                // Interpolera vinkeln mot målet för en mjuk (ease-out) snurr
                flipAngle += (targetFlipAngle - flipAngle) * 0.1;
                
                // Om vi är nära målet, stanna animationen
                if (Math.abs(targetFlipAngle - flipAngle) < 0.01) {
                    flipAngle = targetFlipAngle;
                    isAnimating = false;
                }
            }
            
            draw();
            if (isAnimating) requestFrame();
        }

        // Trigga kortflipp
        function flipCard() {
            if (isAnimating) return; // Förhindra dubbelklick under animation
            
            isAnimating = true;
            if (cardState === 'front') {
                targetFlipAngle = Math.PI; // Snurra 180 grader till baksidan
                cardState = 'back';
            } else {
                targetFlipAngle = 0; // Snurra tillbaka till framsidan
                cardState = 'front';
            }
            requestFrame();
        }

        // Klick på canvas = flippa kortet
        canvas.addEventListener('click', () => {
            flipCard();
        });

        // Byt fråga och återställ kortet
        function changeQuestion(delta) {
            if (questions.length === 0) return;
            
            currentIndex += delta;
            
            // Loopa runt om vi når slutet/början
            if (currentIndex >= questions.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = questions.length - 1;

            // Återställ kortet till framsidan omedelbart utan animering
            flipAngle = 0;
            targetFlipAngle = 0;
            cardState = 'front';
            isAnimating = false;
            
            draw();
        }

        // Lyssna på navigationsknapparna
        document.getElementById('btnNext').addEventListener('click', (e) => {
            e.stopPropagation(); // Förhindra att klicket går till canvas
            changeQuestion(1);
        });

        document.getElementById('btnPrev').addEventListener('click', (e) => {
            e.stopPropagation();
            changeQuestion(-1);
        });

        // Lyssna på läges-knapparna (Ordning / Slumpmässigt)
        const btnOrder = document.getElementById('btnOrder');
        const btnRandom = document.getElementById('btnRandom');

        btnOrder.addEventListener('click', (e) => {
            e.stopPropagation();
            if(!isRandomMode) return;
            
            isRandomMode = false;
            currentIndex = 0; // Börja från början
            
            // Uppdatera UI
            btnOrder.classList.add('active-mode', '!text-sm', '!bg-[#E585B4]', '!text-[#422634]');
            btnOrder.classList.remove('!bg-transparent');
            
            btnRandom.classList.remove('active-mode', '!bg-[#E585B4]', '!text-[#422634]');
            btnRandom.classList.add('!bg-transparent');
            
            changeQuestion(0); // Tvinga uppdatering
        });

        btnRandom.addEventListener('click', (e) => {
            e.stopPropagation();
            if(isRandomMode) return;
            
            isRandomMode = true;
            currentIndex = 0;
            shuffleArray(shuffledIndices); // Blanda om!
            
            // Uppdatera UI
            btnRandom.classList.add('active-mode', '!text-sm', '!bg-[#E585B4]', '!text-[#422634]');
            btnRandom.classList.remove('!bg-transparent');
            
            btnOrder.classList.remove('active-mode', '!bg-[#E585B4]', '!text-[#422634]');
            btnOrder.classList.add('!bg-transparent');
            
            changeQuestion(0); // Tvinga uppdatering
        });

        // Starta appen
        fetchQuestions();

    </script>
</body>
</html>
