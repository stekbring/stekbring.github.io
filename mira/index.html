<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NKSE Flashcards</title>
    <style>
        /* Color Palette */
        :root {
            --color-1: #B86A90; /* Pinkish */
            --color-2: #945674; /* Darker Pinkish */
            --color-3: #6B3E54; /* Plum */
            --color-4: #422634; /* Dark Plum */
            --color-5: #E585B4; /* Light Pink */
            --text-light: #F8F0F4;
            --text-dark: #2D1A24;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--color-4);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            color: var(--color-5);
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            text-align: center;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
            background-color: var(--color-3);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        button, select {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background-color: var(--color-1);
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            outline: none;
        }

        button:hover, select:hover {
            background-color: var(--color-5);
            color: var(--text-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        button:active {
            transform: translateY(0);
        }

        select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg fill="white" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/><path d="M0 0h24v24H0z" fill="none"/></svg>');
            background-repeat: no-repeat;
            background-position: right 10px center;
            padding-right: 35px;
        }

        .flashcard-container {
            perspective: 1000px;
            width: 100%;
            max-width: 600px;
            height: 400px;
            margin-bottom: 30px;
            cursor: pointer;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border-radius: 16px;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            box-sizing: border-box;
            border-radius: 16px;
            text-align: center;
            border: 2px solid var(--color-2);
        }

        .card-front {
            background: linear-gradient(135deg, var(--color-2), var(--color-3));
            color: var(--text-light);
        }

        .card-back {
            background: linear-gradient(135deg, var(--color-1), var(--color-5));
            color: var(--text-dark);
            transform: rotateY(180deg);
            overflow-y: auto; /* Allow scrolling for long answers */
            align-items: flex-start; /* Align text to top when scrolling */
            justify-content: flex-start;
        }
        
        /* Custom scrollbar for back card */
        .card-back::-webkit-scrollbar {
            width: 8px;
        }
        .card-back::-webkit-scrollbar-track {
            background: transparent; 
        }
        .card-back::-webkit-scrollbar-thumb {
            background: var(--color-3); 
            border-radius: 4px;
        }
        .card-back::-webkit-scrollbar-thumb:hover {
            background: var(--color-4); 
        }

        .question-number {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 14px;
            font-weight: bold;
            opacity: 0.8;
            background-color: rgba(0,0,0,0.2);
            padding: 5px 10px;
            border-radius: 20px;
        }

        .card-text {
            font-size: 22px;
            line-height: 1.5;
            width: 100%;
            margin-top: 20px;
        }
        
        .card-back .card-text {
            margin-top: 40px; /* Space for question number */
            font-size: 18px; /* Slightly smaller for answers which are often longer */
            text-align: left;
            padding-bottom: 20px;
        }

        .hint {
            position: absolute;
            bottom: 15px;
            font-size: 12px;
            opacity: 0.6;
            font-style: italic;
        }

        /* Loading state */
        .loading {
            font-size: 24px;
            color: var(--color-5);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        @media (max-width: 600px) {
            .flashcard-container {
                height: 350px;
            }
            .card-text {
                font-size: 18px;
            }
            .card-back .card-text {
                font-size: 16px;
            }
            .controls {
                flex-direction: column;
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>

    <h1>NKSE Flashcards</h1>

    <div class="controls">
        <select id="modeSelect">
            <option value="sequential">Ordning (Sequential)</option>
            <option value="random">Slumpmässig (Random)</option>
        </select>
        <button id="prevBtn">Föregående (Prev)</button>
        <button id="nextBtn">Nästa (Next)</button>
    </div>

    <div id="loading" class="loading">Laddar frågor... (Loading...)</div>

    <div id="flashcardContainer" class="flashcard-container" style="display: none;">
        <div class="flashcard" id="flashcard">
            <!-- Front of card (Question) -->
            <div class="card-face card-front">
                <div class="question-number" id="qNumFront">Fråga X</div>
                <div class="card-text" id="questionText">Fråga laddas...</div>
                <div class="hint">Klicka för att vända</div>
            </div>
            <!-- Back of card (Answer) -->
            <div class="card-face card-back">
                <div class="question-number" id="qNumBack" style="background-color: rgba(255,255,255,0.4);">Fråga X</div>
                <div class="card-text" id="answerText">Svar laddas...</div>
            </div>
        </div>
    </div>

    <script>
        const flashcard = document.getElementById('flashcard');
        const flashcardContainer = document.getElementById('flashcardContainer');
        const questionText = document.getElementById('questionText');
        const answerText = document.getElementById('answerText');
        const qNumFront = document.getElementById('qNumFront');
        const qNumBack = document.getElementById('qNumBack');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const modeSelect = document.getElementById('modeSelect');
        const loadingDiv = document.getElementById('loading');

        let questions = [];
        let currentIndex = 0;
        let isRandom = false;
        let isFlipped = false;
        // Keep track of visited random indices to allow 'prev' functionality in random mode
        let randomHistory = []; 

        // Flip card on click
        flashcardContainer.addEventListener('click', () => {
            isFlipped = !isFlipped;
            flashcard.classList.toggle('flipped', isFlipped);
        });

        // Navigation buttons
        nextBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // Prevent flipping when clicking buttons
            goToNextQuestion();
        });

        prevBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            goToPrevQuestion();
        });

        // Mode selection
        modeSelect.addEventListener('change', (e) => {
            isRandom = e.target.value === 'random';
            randomHistory = []; // Reset history when changing modes
            if (isRandom) {
                currentIndex = getRandomIndex();
                randomHistory.push(currentIndex);
            } else {
                currentIndex = 0;
            }
            displayQuestion();
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter') {
                e.preventDefault(); // Prevent page scroll
                isFlipped = !isFlipped;
                flashcard.classList.toggle('flipped', isFlipped);
            } else if (e.code === 'ArrowRight') {
                goToNextQuestion();
            } else if (e.code === 'ArrowLeft') {
                goToPrevQuestion();
            }
        });

        function getRandomIndex() {
            if (questions.length === 0) return 0;
            let newIndex = Math.floor(Math.random() * questions.length);
            // Try not to show the exact same question twice in a row if possible
            if (questions.length > 1 && newIndex === currentIndex) {
                newIndex = (newIndex + 1) % questions.length;
            }
            return newIndex;
        }

        function goToNextQuestion() {
            if (questions.length === 0) return;
            
            if (isFlipped) {
                // Flip back first, then change content
                isFlipped = false;
                flashcard.classList.remove('flipped');
                setTimeout(() => {
                    updateIndexNext();
                    displayQuestion();
                }, 300); // Wait half of flip animation time
            } else {
                updateIndexNext();
                displayQuestion();
            }
        }

        function updateIndexNext() {
            if (isRandom) {
                currentIndex = getRandomIndex();
                randomHistory.push(currentIndex);
            } else {
                currentIndex = (currentIndex + 1) % questions.length;
            }
        }

        function goToPrevQuestion() {
            if (questions.length === 0) return;

            if (isFlipped) {
                isFlipped = false;
                flashcard.classList.remove('flipped');
                setTimeout(() => {
                    updateIndexPrev();
                    displayQuestion();
                }, 300);
            } else {
                updateIndexPrev();
                displayQuestion();
            }
        }

        function updateIndexPrev() {
            if (isRandom) {
                if (randomHistory.length > 1) {
                    randomHistory.pop(); // Remove current
                    currentIndex = randomHistory[randomHistory.length - 1]; // Get previous
                } else {
                    // If at the start of random history, generate a new random one
                    currentIndex = getRandomIndex();
                    randomHistory.push(currentIndex);
                }
            } else {
                currentIndex = (currentIndex - 1 + questions.length) % questions.length;
            }
        }

        function displayQuestion() {
            if (questions.length === 0) return;
            
            const currentQ = questions[currentIndex];
            // Since you have multiple sets (1-100, 101-200, etc), the actual index in the array 
            // might not match the original question number if they are combined. 
            // We'll display "Kort X av Y" to be safe and clear.
            const displayNum = `Kort ${currentIndex + 1} / ${questions.length}`;
            
            qNumFront.textContent = displayNum;
            qNumBack.textContent = displayNum;
            questionText.textContent = currentQ.q;
            
            // Format answer: Replace
